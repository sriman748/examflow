services:
  - type: web
    name: examflow
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/migrate.js && node src/seed.js && node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: examflow-db
    plan: free

