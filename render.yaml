databases:
  - name: examflow-db
    databaseName: examflow
    user: examflow_user
    plan: free

services:
  - type: web
    name: examflow
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: examflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: sriman_cse@mvsrec.edu.in
      - key: ADMIN_PASSWORD
        value: Sparky@748

