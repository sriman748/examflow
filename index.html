<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExamFlow | Modern Assessment & Testing Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-glow: rgba(79, 70, 229, 0.15);
      
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --info: #0ea5e9;
      --info-light: #f0f9ff;
      
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-hover: #f8fafc;
      --border: #e2e8f0;
      --border-focus: #6366f1;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.08), 0 8px 10px -6px rgb(0 0 0 / 0.04);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.04) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(168, 85, 247, 0.03) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Top Navigation Bar */
    header {
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-xs);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .brand-title {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--primary-light);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .user-meta {
      text-align: right;
    }
    .user-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .user-role-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .role-admin { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .role-faculty { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .role-student { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 1.5rem;
    }

    /* Tabs Styling */
    .tabs-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      background: rgba(241, 245, 249, 0.85);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow-x: auto;
      backdrop-filter: blur(8px);
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.7);
    }
    .tab-btn.active {
      color: var(--primary);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      position: relative;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.01em;
    }
    .card-subtitle {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Course Card Theming */
    .course-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.4rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .course-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .course-theme-python {
      border-top: 4px solid #10b981;
    }
    .course-theme-python .course-badge {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .course-theme-sql {
      border-top: 4px solid #0284c7;
    }
    .course-theme-sql .course-badge {
      background: #f0f9ff;
      color: #0284c7;
      border: 1px solid #bae6fd;
    }
    .course-theme-algo {
      border-top: 4px solid #7c3aed;
    }
    .course-theme-algo .course-badge {
      background: #f5f3ff;
      color: #7c3aed;
      border: 1px solid #ddd6fe;
    }
    .course-theme-general {
      border-top: 4px solid #4f46e5;
    }
    .course-theme-general .course-badge {
      background: #eef2ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
    }

    /* Metrics Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), #a855f7);
    }
    .stat-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 0.35rem 0;
      letter-spacing: -0.03em;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-footer {
      font-size: 0.78rem;
      color: var(--text-light);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.62rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      text-decoration: none;
      line-height: 1;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #fff;
      box-shadow: 0 2px 4px var(--primary-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px var(--primary-glow);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface-subtle);
      border-color: var(--text-light);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
    }
    .btn-success:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
    }
    .btn-warning {
      background: #f59e0b;
      color: #fff;
    }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-danger:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }
    .btn-sm {
      padding: 0.42rem 0.8rem;
      font-size: 0.78rem;
      border-radius: var(--radius-sm);
    }
    .btn-outline {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: var(--surface-subtle);
      border-color: var(--text-light);
    }

    /* Forms */
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }
    .form-control, input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="datetime-local"], select, textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-family: inherit;
      font-size: 0.88rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      transition: all 0.2s ease;
      outline: none;
    }
    .form-control:focus, input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.22rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      text-transform: capitalize;
    }
    .badge-primary { background: var(--primary-light); color: var(--primary); border: 1px solid rgba(79,70,229,0.2); }
    .badge-success { background: var(--success-light); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
    .badge-warning { background: var(--warning-light); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
    .badge-danger { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .badge-info { background: var(--info-light); color: var(--info); border: 1px solid rgba(14,165,233,0.2); }
    .badge-muted { background: var(--surface-subtle); color: var(--text-muted); border: 1px solid var(--border); }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }
    th {
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-weight: 700;
      padding: 0.85rem 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(248, 250, 252, 0.8); }

    /* Exam Engine Taker */
    .exam-wrapper {
      max-width: 1000px;
      margin: 0 auto;
    }
    .exam-topbar {
      background: #0f172a;
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 1.1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
    }
    .exam-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.45rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.4rem 1.1rem;
      border-radius: var(--radius-md);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .timer-danger {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.4);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .exam-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-xs);
    }
    .pal-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-family: 'JetBrains Mono', monospace;
    }
    .pal-btn:hover { border-color: var(--primary); }
    .pal-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }
    .pal-btn.answered { background: var(--success); color: #fff; border-color: var(--success); }
    .pal-btn.marked { background: var(--warning); color: #fff; border-color: var(--warning); }
    .pal-legend {
      display: flex;
      gap: 1.25rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .q-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary);
    }
    .q-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 1.75rem;
      color: var(--text-main);
    }
    .opt-card {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--surface);
    }
    .opt-card:hover {
      background: var(--surface-subtle);
      border-color: var(--border-focus);
    }
    .opt-card.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-hover);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--primary);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.25rem;
      animation: fadeIn 0.2s ease;
    }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      max-width: 600px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.35rem;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
    }

    /* Toasts */
    #toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--surface);
      color: var(--text-main);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border-left: 4px solid var(--primary);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.toast-success { border-left-color: var(--success); }
    .toast.toast-error { border-left-color: var(--danger); }

    /* Auth Views */
    .auth-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-xl);
      animation: fadeIn 0.3s ease;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-switch {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .auth-switch a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-switch a:hover { text-decoration: underline; }

    /* Utilities */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .gap-4 { gap: 1rem; }
    .mt-4 { margin-top: 1rem; }
    .mb-4 { margin-bottom: 1rem; }
    .text-center { text-align: center; }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 0.82rem; }
    .font-bold { font-weight: 700; }

    /* Upload & Question Extractor UI */
    .upload-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-lg);
      background: var(--surface);
      padding: 2.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .upload-dropzone:hover, .upload-dropzone.dragover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px var(--primary-glow);
    }
    .upload-dropzone.loading {
      pointer-events: none;
      opacity: 0.8;
      background: var(--surface-subtle);
    }
    .file-badge-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .file-type-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pill-pdf { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .pill-docx { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .pill-txt { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    
    .selected-file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      margin-top: 1rem;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.2s ease;
    }
    .draft-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-xs);
    }
    .draft-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .draft-card.needs-review {
      border-left: 4px solid var(--warning);
    }
    .draft-card.ready {
      border-left: 4px solid var(--success);
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(79, 70, 229, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Top Nav Links */
    .nav-group {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      list-style: none;
    }
    .nav-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .nav-link:hover {
      color: var(--primary);
      background: var(--surface-subtle);
    }
    .nav-link.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
    }

    /* Google Button */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      background: #ffffff;
      color: #374151;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.7rem 1.25rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-xs);
    }
    .google-btn:hover {
      background: #f9fafb;
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Hero Section */
    .hero-container {
      padding: 3.5rem 1rem 3rem;
      text-align: center;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.2);
      padding: 0.4rem 1rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .hero-title {
      font-size: 3.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1.25rem;
      color: var(--text-main);
    }
    .hero-title .gradient-text {
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 760px;
      margin: 0 auto 2.25rem;
      line-height: 1.6;
    }
    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
      flex-wrap: wrap;
    }

    /* Live Stat Chips / Metrics */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      max-width: 1040px;
      margin: 0 auto 3.5rem;
    }
    .metric-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .metric-chip:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-focus);
    }
    .metric-val {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 0.35rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .metric-lbl {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Problem vs Solution Split Grid */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 3.5rem;
    }
    @media (max-width: 868px) {
      .split-grid { grid-template-columns: 1fr; }
      .hero-title { font-size: 2.25rem; }
      .nav-links { display: none; }
    }
    .split-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }
    .split-card.problem {
      border-top: 5px solid var(--danger);
    }
    .split-card.solution {
      border-top: 5px solid var(--success);
    }

    /* Features Grid */
    .feature-grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3.5rem;
    }
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .feature-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-focus);
    }
    .feature-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* Role Register Tabs */
    .role-tabs {
      display: flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 1.5rem;
      gap: 4px;
    }
    .role-tab-btn {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .role-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Profile Page Styling */
    .profile-hero {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      box-shadow: var(--shadow-lg);
    }
    .profile-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 3px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
    }

    /* Footer */
    footer.site-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 3.5rem 1.5rem 2rem;
      margin-top: auto;
    }
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 2.5rem;
      margin-bottom: 2.5rem;
    }
    @media (max-width: 768px) {
      .footer-inner { grid-template-columns: 1fr; }
    }
    .footer-col h5 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text-main);
    }
    .footer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.15s ease;
    }
    .footer-links a:hover {
      color: var(--primary);
    }
    .footer-bottom {
      max-width: 1280px;
      margin: 0 auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 1rem;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
